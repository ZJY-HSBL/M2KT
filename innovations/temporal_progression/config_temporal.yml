# TemporalLAMRG Configuration (Direction 5)
# Longitudinal radiology report generation with disease progression modeling

_BASE_: "../../config/mimic_resnet.yml"

# ---- Experiment ----
expe_name: "temporal_lamrg_v1"
version: 500
dataset_name: "mimic_cxr"       # MIMIC-CXR required for longitudinal data

# ---- Temporal Pairing ----
max_time_delta: 365             # Maximum days between paired studies
min_time_delta: 1               # Minimum days (avoid same-day duplicates)

# ---- Temporal Loss Weights ----
progression_weight: 1.0         # Progression classification loss
consistency_weight: 0.5         # Temporal consistency loss
smoothness_weight: 0.3          # Severity smoothness loss
report_alignment_weight: 0.3    # Report-label alignment loss

# ---- Model ----
num_memory_heads: 8
num_slots: 64

# ---- Training ----
label_loss: true
rank_loss: true
epochs: 50
batch_size: 8                   # Reduced: two images per sample
lr_ed: 0.0001
lr_ve: 0.00001
grad_clip: 5.0
early_stop: 10
monitor_mode: "max"
monitor_metric: "BLEU_4"

# ---- Model Architecture ----
d_model: 512
d_ff: 2048
d_vf: 2048
num_heads: 8
num_layers: 3
dropout: 0.1
N_enc: 3
N_dec: 3
