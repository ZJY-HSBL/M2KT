# AgentLAMRG Configuration (Direction 2)
# Agent-based iterative self-refinement with DPO training

_BASE_: "../../config/iu_resnet.yml"

# ---- Experiment ----
expe_name: "agent_lamrg_v1"
version: 200

# ---- Agent Configuration ----
max_refine_steps: 3           # Maximum refinement iterations
refiner_layers: 3             # Number of refiner encoder layers

# ---- DPO Training ----
use_dpo: true                 # Enable Direct Preference Optimization
dpo_beta: 0.1                 # DPO temperature (lower = more conservative)
dpo_weight: 0.5               # Weight of DPO loss in total objective

# ---- Auxiliary Losses ----
consistency_weight: 0.1       # Weight for consistency loss
completeness_weight: 0.1      # Weight for completeness loss
label_loss: true              # Enable label prediction loss
rank_loss: true               # Enable multi-modal ranking loss

# ---- Training ----
epochs: 50
batch_size: 16
lr_ed: 0.0001
lr_ve: 0.00001
grad_clip: 5.0
early_stop: 10
monitor_mode: "max"
monitor_metric: "BLEU_4"

# ---- Model Architecture ----
d_model: 512
d_ff: 2048
d_vf: 2048
num_heads: 8
num_layers: 3
dropout: 0.1
N_enc: 3
N_dec: 3
